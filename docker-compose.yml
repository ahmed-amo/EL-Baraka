services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: baraka
      MYSQL_DATABASE: baraka
      MYSQL_USER: baraka
      MYSQL_PASSWORD: baraka
    ports:
      - "3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - baraka_mariadb:/var/lib/mysql

volumes:
  baraka_mariadb:
