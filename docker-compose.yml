services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: baraka
      MYSQL_DATABASE: baraka
      MYSQL_USER: baraka
      MYSQL_PASSWORD: baraka
    ports:
      - "3306:3306"
    command: ["--default-authentication-plugin=caching_sha2_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - baraka_mysql:/var/lib/mysql

volumes:
  baraka_mysql:
